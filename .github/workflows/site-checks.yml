name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"

      - name: Render site
        run: quarto render

      - name: Validate required files, metadata, and internal links
        run: node scripts/check-site.mjs

      - name: Confirm generated site is current
        run: git diff --exit-code -- docs
