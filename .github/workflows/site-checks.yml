name: Site checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.9.37"

      - name: Render site
        shell: bash
        run: |
          for attempt in 1 2; do
            if quarto render; then
              exit 0
            fi
            echo "Quarto render attempt ${attempt} failed; retrying once."
          done
          exit 1

      - name: Validate required files, metadata, and internal links
        run: node scripts/check-site.mjs

      - name: Confirm generated site is current
        # Quarto derives sitemap <lastmod> values from checkout-time file
        # timestamps, so that one generated file is intentionally excluded.
        run: git diff --exit-code -- docs ":(exclude)docs/sitemap.xml"
