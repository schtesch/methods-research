project:
  type: book
  output-dir: docs

bibliography: references.bib
csl: vancouver-superscript.csl

book:
  title: "TYPE-ME — Typology of Methods Research"
  description: "A typology for planning, reporting, classifying, and understanding methods research in health research and psychology."
  site-url: "https://methods-research.org"
  image: "images/type-me-social.png"
  image-alt: "TYPE-ME — Typology of Methods Research"
  license: "CC BY-NC 4.0"
  favicon: images/favicon-v2.svg
  open-graph:
    site-name: "TYPE-ME"
    locale: en_GB
  twitter-card:
    card-style: summary_large_image

  sidebar:
    style: floating
    search: true
    collapse-level: 1
    logo: images/logo.png
    logo-alt: "TYPE-ME — Typology of Methods Research"

  page-footer:
    left: "Funded by [Swiss National Science Foundation (SNSF)](https://www.snf.ch)"

    right:
      - text: "Legal notice"
        href: impressum.html

    center:
      - text: "Contact"
        href: "mailto:stefan.schandelmaier@unibas.ch"
    background: "#eef3f8"
    foreground: "#3a4a5a"
    border: false

  chapters:
    - index.qmd
    - text: "Overview figure"
      href: explore.qmd
    - simplified.qmd

    - part: "Explore by approach"
      chapters:
        - approaches/1theory.qmd
        - approaches/2simulation.qmd
        - approaches/3real-datasets.qmd
        - approaches/4reliability.qmd
        - approaches/5randomized.qmd
        - approaches/6survey.qmd
        - approaches/7qualitative.qmd
        - approaches/8consensus.qmd
        - approaches/9review-applied.qmd
        - approaches/10meta-epi.qmd
        - approaches/11scoping-review.qmd
        - approaches/12qualitative-synthesis.qmd
        - approaches/13quantitative-synthesis.qmd
        - approaches/14case-report.qmd
        - approaches/15informal.qmd

    - part: "Explore by objective"
      chapters:
        - objectives/1identify-methods.qmd
        - objectives/2identify-mr.qmd
        - objectives/3summarize-mr.qmd
        - objectives/4assess-practice.qmd
        - objectives/5assess-needs-priorities.qmd
        - objectives/6propose-method.qmd
        - objectives/7evaluate-method.qmd
        - objectives/8compare-methods.qmd
        - objectives/9guidance-applying.qmd
        - objectives/10guidance-reporting.qmd
        - objectives/11guidance-assessing.qmd
        - objectives/12software-code.qmd
        - objectives/13implementation.qmd
        - objectives/14variability.qmd

    - references.qmd
    - impressum.qmd

format:
  html:
    number-sections: false
    reference-location: block
    canonical-url: true
    theme: journal
    bread-crumbs: true
    toc: false
    smooth-scroll: true
    anchor-sections: true
    css: styles.css
    include-in-header: includes/metadata.html
    grid:
      sidebar-width: 20rem
